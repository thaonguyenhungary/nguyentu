<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nơi yên nghỉ của Ba — Thắp hương tưởng nhớ</title>
<style>
:root{--gold:#d9a84e;--gold-s:#efd49a;--cream:#f5e9d0;--ink:#0d0907}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}
body{font-family:"Noto Serif",Georgia,"Times New Roman",serif;color:var(--cream);
 user-select:none;display:flex;flex-direction:column}
#stage{position:relative;flex:1;overflow:hidden;transform-origin:50% 100%;min-height:0}
#bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.scrim{position:absolute;inset:0;background:
 linear-gradient(rgba(10,7,5,.3) 0%,rgba(10,7,5,0) 22%,rgba(10,7,5,.5) 56%,rgba(13,9,7,.93) 78%,#0d0907 100%)}
.edge{position:absolute;left:0;right:0;bottom:38%;height:1px;
 background:linear-gradient(90deg,transparent,rgba(217,168,78,.45) 20%,rgba(217,168,78,.45) 80%,transparent)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:45}

.portrait{position:absolute;left:50%;bottom:calc(38% + 3px);transform:translateX(-50%);
 width:min(31vw,128px);z-index:24;text-align:center}
.frame{padding:5px;border-radius:4px;background:linear-gradient(145deg,var(--gold-s),#9d7129);
 box-shadow:0 10px 26px rgba(0,0,0,.7),0 0 24px rgba(217,168,78,.15)}
.frame img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:2px}
.ten{font-size:clamp(14px,4vw,18px);color:var(--gold-s);margin-top:7px}
.hieu{font-size:10.5px;color:rgba(245,233,208,.5);font-style:italic}
.nam{font-size:11px;color:rgba(245,233,208,.6);margin-top:2px}

.bowl{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);
 width:min(26vw,100px);height:min(13.5vw,50px);z-index:32}
.bowl .body{position:absolute;inset:auto 0 0 0;height:74%;
 background:linear-gradient(#caa05a,#7d5a24);border-radius:0 0 46% 46%/0 0 72% 72%;
 border:1.5px solid rgba(217,168,78,.6);box-shadow:inset 0 6px 14px rgba(0,0,0,.45)}
.bowl .ash{position:absolute;left:9%;right:9%;top:15%;height:27%;
 background:linear-gradient(#d3c3aa,#8d7e6b);border-radius:50%}
#sticks{position:absolute;left:0;right:0;bottom:60%;height:0;z-index:33}
.stick{position:absolute;bottom:0;width:3px;transform-origin:50% 100%;border-radius:2px;
 background:linear-gradient(#6d2a20,#9c3a28)}
.stick .tip{position:absolute;top:-3px;left:-2.5px;width:8px;height:8px;border-radius:50%;
 background:radial-gradient(circle,#fff4c8,#ff9c2d 45%,#bc370a 80%);
 box-shadow:0 0 15px 5px rgba(255,140,32,.5);animation:ember 2.2s infinite ease-in-out}
@keyframes ember{0%,100%{opacity:.78;transform:scale(.9)}50%{opacity:1;transform:scale(1.14)}}

.candle{position:absolute;bottom:21%;width:min(5.5vw,21px);z-index:30}
.candle.l{left:26%}.candle.r{right:26%}
.candle .wax{height:min(10vw,36px);border-radius:3px;border:1px solid rgba(217,168,78,.3);
 background:linear-gradient(90deg,#6e6a3a,#cfc77a 40%,#6e6a3a)}
.flame{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:9px;height:17px;
 border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0;transition:opacity .5s;filter:blur(.4px);
 background:radial-gradient(circle at 50% 70%,#fff9d4,#ffbe3d 45%,rgba(255,110,0,.08) 80%)}
.candle.on .flame{opacity:1;animation:flick 1.6s infinite}
@keyframes flick{0%,100%{transform:translateX(-50%) scaleY(1) rotate(-1deg)}
 50%{transform:translateX(-50%) scaleY(1.15) rotate(2deg)}}

#mam{position:absolute;left:0;right:0;bottom:2%;z-index:26;display:flex;flex-wrap:wrap;
 justify-content:center;align-content:flex-end;gap:2px 4px;padding:0 6px;max-height:17%}
.dish{width:min(13vw,50px);text-align:center;opacity:0;transform:translateY(16px) scale(.85);
 transition:all .55s cubic-bezier(.2,.9,.2,1)}
.dish.on{opacity:1;transform:none}
.dish .ic svg{width:min(9vw,36px);height:min(9vw,36px);display:block;margin:0 auto;filter:drop-shadow(0 4px 7px rgba(0,0,0,.6))}
.dish .lb{font-size:8px;color:rgba(245,233,208,.5);line-height:1.2;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}

#lo{position:absolute;right:5%;bottom:23%;z-index:34;width:min(19vw,72px);opacity:0;
 transition:opacity .6s;pointer-events:none}
#lo.on{opacity:1}
#lo .pot{height:min(11vw,40px);border-radius:7px 7px 13px 13px;
 background:linear-gradient(#5d4433,#2a1b11);border:1.5px solid rgba(217,168,78,.4);
 box-shadow:inset 0 5px 12px rgba(0,0,0,.6)}
#lo .lbl{font-size:8px;text-align:center;color:rgba(245,233,208,.42);margin-top:3px}
#lo .paper{position:absolute;left:50%;top:-10px;transform:translateX(-50%)}
#lo .paper svg{width:min(8vw,32px);height:min(8vw,32px);display:block}

#bar{position:relative;z-index:60;background:#0d0907;border-top:1px solid rgba(217,168,78,.2);
 padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.count{text-align:center;font-size:10.5px;color:rgba(245,233,208,.5);margin-bottom:7px}
.count b{color:var(--gold-s);font-weight:600}
.row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
button{font-family:inherit;font-size:12.5px;color:var(--cream);cursor:pointer;white-space:nowrap;
 background:linear-gradient(rgba(109,31,28,.8),rgba(55,14,13,.9));
 border:1px solid rgba(217,168,78,.36);border-radius:999px;padding:8px 12px;transition:transform .12s}
button:active{transform:scale(.95)}
button.main{background:linear-gradient(#a8432f,#6d1f1c);border-color:var(--gold);
 box-shadow:0 0 15px rgba(217,168,78,.25);padding:9px 17px;font-size:13.5px}
button.on{background:linear-gradient(#3b2b17,#241a0e);border-color:var(--gold-s);color:var(--gold-s)}
button.ghost{background:transparent;border-color:rgba(245,233,208,.18);color:rgba(245,233,208,.66)}

.panel{position:fixed;inset:0;z-index:100;background:rgba(8,5,4,.95);backdrop-filter:blur(7px);
 display:none;flex-direction:column;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.panel.open{display:flex}
h2{margin:2px 0 10px;font-size:16px;color:var(--gold-s);font-weight:500;text-align:center}
.tabs{display:flex;gap:5px;justify-content:center;margin-bottom:9px}
.tabs button{font-size:12px;padding:6px 11px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
 gap:6px;align-content:start}
.it{background:rgba(245,233,208,.05);border:1px solid rgba(217,168,78,.18);border-radius:10px;
 padding:8px 4px;text-align:center;cursor:pointer;transition:all .18s}
.it.on{background:rgba(217,168,78,.17);border-color:var(--gold-s)}
.it .ic svg{width:36px;height:36px;display:block;margin:0 auto}
.it .nm{font-size:10px;margin-top:3px;color:rgba(245,233,208,.8);line-height:1.3}
.it .ds{font-size:8.5px;color:rgba(245,233,208,.4);line-height:1.3}
.hint{font-size:10px;color:rgba(245,233,208,.38);text-align:center;margin:7px 0 2px;line-height:1.5}

/* thư viện ảnh */
#gal .strip{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;
 -webkit-overflow-scrolling:touch}
#gal .sl{min-width:100%;flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;
 justify-content:center;gap:8px}
#gal .sl img{width:100%;max-height:72vh;object-fit:contain;border-radius:8px}
#gal .cp{font-size:12px;color:rgba(245,233,208,.6);text-align:center}

/* gia quyến */
#info .bd{flex:1;overflow:auto;font-size:13.5px;line-height:1.85;white-space:pre-line}
#info .bd .k{color:var(--gold-s);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
 display:block;margin:12px 0 2px}

#msgs{flex:1;overflow:auto}
.msg{background:rgba(245,233,208,.05);border-left:2px solid rgba(217,168,78,.45);
 border-radius:0 7px 7px 0;padding:9px 11px;margin-bottom:8px;font-size:13.5px;line-height:1.6}
.msg .who{color:var(--gold-s);font-size:11px;display:block;margin-bottom:3px}
.empty{color:rgba(245,233,208,.4);font-size:13px;text-align:center;padding:24px 10px;line-height:1.7}
#book input,#book textarea{width:100%;font-family:inherit;font-size:14px;color:var(--cream);
 background:rgba(245,233,208,.07);border:1px solid rgba(217,168,78,.22);border-radius:8px;
 padding:9px 11px;margin-top:7px}
#book textarea{height:64px;resize:none}
a.lnk{color:var(--gold-s);font-size:12px;text-align:center;display:block;margin-top:8px}
</style>
</head>

 ["g1","Toàn cảnh khu lăng"],["g10","Phần mộ Ba trước từ đường"],["g9","Bia mộ Ba"],

  {s:"ga-luoc",n:"Gà luộc",d:"Nguyên con"},{s:"xoi-gac",n:"Xôi gấc",d:""},
  {s:"che",n:"Chè",d:"6 chén"},{s:"chao",n:"Cháo",d:"Cháo hoa"},
  {s:"banh-it",n:"Bánh ít lá gai",d:"Món quê"},{s:"banh-tet",n:"Bánh tét",d:""},
  {s:"canh",n:"Canh rau",d:""}],
 vm:[{s:"tien-vang",n:"Tiền vàng",d:""},{s:"quan-ao",n:"Quần áo",d:""},
  {s:"giay-mu",n:"Giày mũ",d:""},{s:"nha",n:"Nhà",d:""},{s:"xe",n:"Xe",d:""},
  {s:"sach-but",n:"Sách & bút",d:"Ba là thầy giáo"},{s:"dien-thoai",n:"Điện thoại",d:""}]
};
const icon=k=>'<svg viewBox="0 0 64 64"><use href="#i-'+k+'"></use></svg>';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
$('#o-ten').textContent=C.ten;$('#o-hieu').textContent=C.hieu;$('#o-nam').textContent=C.nam;
if(C.formUrl){const a=$('#lnk-form');a.href=C.formUrl;a.style.display='block';}
GIA_QUYEN.forEach(([k,v])=>{const d=document.createElement('div');
 d.innerHTML='<span class="k"></span>';d.querySelector('.k').textContent=k;
 d.appendChild(document.createTextNode(v));$('#info-bd').appendChild(d);});
ANH.forEach(([f,c])=>{const s=document.createElement('div');s.className='sl';
 const im=document.createElement('img');im.src=f+'.jpg';im.alt=c;im.loading='lazy';
 const p=document.createElement('div');p.className='cp';p.textContent=c;
 s.appendChild(im);s.appendChild(p);$('#strip').appendChild(s);});

let AC=null;
function chuong(f=420){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 const t=AC.currentTime;[1,2.02,3.01].forEach((m,i)=>{const o=AC.createOscillator(),g=AC.createGain();
 o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15/(i+1),t+.01);
 g.gain.exponentialRampToValueAtTime(.0001,t+3.2);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+3.3);});}catch(e){}}

const cv=$('#fx'),cx=cv.getContext('2d');let W,H,DPR=Math.min(devicePixelRatio||1,2);
function size(){const r=$('#stage').getBoundingClientRect();W=r.width;H=r.height;
 cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',size);size();
const P=[],EM=[];
function spawn(x,y,k){
 if(k==='fire'){P.push({x:x+(Math.random()-.5)*22,y,vx:(Math.random()-.5)*.3,vy:-(.8+Math.random()*.7),
  r:3+Math.random()*4,a:.5,life:0,max:45+Math.random()*35,k:'fire',sw:0});
  if(Math.random()<.3)P.push({x:x+(Math.random()-.5)*20,y:y-10,vx:(Math.random()-.5)*.3,
   vy:-(.4+Math.random()*.4),r:2+Math.random()*2,a:.22,life:0,max:160+Math.random()*90,k:'ash',sw:(Math.random()-.5)*.03});
 }else P.push({x:x+(Math.random()-.5)*3,y,vx:(Math.random()-.5)*.14,vy:-(.32+Math.random()*.26),
  r:2+Math.random()*3,a:.33+Math.random()*.16,life:0,max:170+Math.random()*120,k:'smoke',sw:(Math.random()-.5)*.028});
}
function tick(dt){
 EM.forEach(e=>{const el=e.el;if(!el.isConnected){e.dead=1;return;}
  const b=el.getBoundingClientRect(),s=$('#stage').getBoundingClientRect();
  if(Math.random()<(e.k==='fire'?1:.5))spawn(b.left-s.left+b.width/2,b.top-s.top+(e.k==='fire'?b.height*.4:0),e.k);});
 for(let i=EM.length-1;i>=0;i--)if(EM[i].dead)EM.splice(i,1);
 cx.clearRect(0,0,W,H);cx.globalCompositeOperation='lighter';
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.life+=dt;
  p.vx+=Math.sin(p.life*.012+p.r)*p.sw;p.x+=p.vx*dt*.06;p.y+=p.vy*dt*.06;
  p.r+=(p.k==='fire'?.06:.028)*dt*.06;
  const k=1-p.life/p.max;if(k<=0||p.y<-20){P.splice(i,1);continue;}
  const R=p.r*(p.k==='fire'?2.4:3.2),a=p.a*k*k,g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,R);
  if(p.k==='fire'){g.addColorStop(0,'rgba(255,228,150,'+a+')');g.addColorStop(.45,'rgba(255,146,38,'+a*.7+')');g.addColorStop(1,'rgba(190,50,0,0)');}
  else if(p.k==='ash'){g.addColorStop(0,'rgba(120,110,100,'+a+')');g.addColorStop(1,'rgba(120,110,100,0)');}
  else{g.addColorStop(0,'rgba(240,230,212,'+a+')');g.addColorStop(1,'rgba(240,230,212,0)');}
  cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,R,0,7);cx.fill();}
 cx.globalCompositeOperation='source-over';
}
let last=performance.now();
(function loop(t){const dt=Math.min(t-last,48);last=t;tick(dt);requestAnimationFrame(loop);})(last);

const API="https://script.google.com/macros/s/AKfycbwO6eeBFBfyALtBf-dbs-hrjOzySsWsmgHr0sJ41cay_YOQx0SaC0nw68Jc8KdKUDSP/exec";   /* dán link /exec của Apps Script vào giữa hai dấu nháy */
let ONLINE=false,SRV=null,_cb=0;
function api(q){return new Promise(function(res){
 if(!API)return res(null);
 var cb='__c'+(++_cb),s=document.createElement('script'),t=setTimeout(function(){done(null)},12000);
 function done(d){clearTimeout(t);try{delete window[cb]}catch(e){}if(s.parentNode)s.remove();res(d)}
 window[cb]=done;s.onerror=function(){done(null)};
 s.src=API+'?cb='+cb+'&'+Object.keys(q).map(function(k){return k+'='+encodeURIComponent(q[k])}).join('&');
 document.body.appendChild(s);});}
const G=k=>+(localStorage.getItem(k)||0);
let nH=G('h'),nV=G('v'),nL=G('l');
function dem(){$('#ch').textContent=nH;$('#cv').textContent=nV;$('#cl').textContent=nL;
 if(!ONLINE){try{localStorage.setItem('h',nH);localStorage.setItem('v',nV);localStorage.setItem('l',nL);}catch(e){}}}
function nhan(d){if(!d||!d.ok)return;ONLINE=true;SRV=d;nH=d.huong;nV=d.vai;nL=d.levat;dem();ve();}
dem();
if(API){api({a:'stats'}).then(nhan);
 $('#h-book').textContent='Lời nhắn được lưu chung — cả nhà ở đâu cũng đọc được.';}

$('#bh').onclick=()=>{
 const box=$('#sticks'),w=$('.bowl').getBoundingClientRect().width;
 for(let i=0;i<3;i++){const s=document.createElement('div');s.className='stick';
  const h=w*(.82+Math.random()*.13);
  s.style.cssText='height:0;left:'+(w/2-4+(i-1)*w*.115)+'px;transform:rotate('+((i-1)*5+(Math.random()-.5)*3)+'deg)';
  const tip=document.createElement('div');tip.className='tip';s.appendChild(tip);box.appendChild(s);
  requestAnimationFrame(()=>{s.style.transition='height .7s cubic-bezier(.2,.9,.2,1)';s.style.height=h+'px';});
  setTimeout(()=>EM.push({el:tip,k:'smoke'}),700);
  const dur=150000;
  setTimeout(()=>{s.style.transition='height '+dur+'ms linear, opacity 3s';s.style.height=(h*.12)+'px';},1400);
  setTimeout(()=>{s.style.opacity=0;setTimeout(()=>s.remove(),3000);},dur);}
 nH+=3;dem();chuong(430);api({a:'huong',n:3}).then(nhan);};

let busy=false;
$('#bv').onclick=()=>{if(busy)return;busy=true;const st=$('#stage');let i=0;
 const b=()=>{st.style.transition='transform .62s cubic-bezier(.4,0,.3,1)';
  st.style.transform='perspective(900px) rotateX(5deg) scale(1.03) translateY(10px)';
  setTimeout(()=>{st.style.transform='none';if(++i<3)setTimeout(b,640);else{busy=false;nV++;dem();api({a:'vai',n:1}).then(nhan);}},640);};
 chuong(330);b();};

$('#bn').onclick=e=>{const on=!$('#nl').classList.contains('on');
 $('#nl').classList.toggle('on',on);$('#nr').classList.toggle('on',on);

let tab='le';const chon={le:new Set(),co:new Set(),vm:new Set()};
const HINT={le:'Chạm để dâng lên trước mộ Ba.',co:'Mâm cỗ nhà mình — chạm để bày lên.',vm:'Chọn đồ rồi bấm Hóa vàng.'};
function veGrid(){const g=$('#grid');g.innerHTML='';
 LEVAT[tab].forEach((o,ix)=>{const d=document.createElement('div');d.className='it'+(chon[tab].has(ix)?' on':'');
  d.innerHTML='<div class="ic"></div><div class="nm"></div><div class="ds"></div>';
  d.querySelector('.ic').innerHTML=icon(o.s);d.querySelector('.nm').textContent=o.n;d.querySelector('.ds').textContent=o.d;
  d.onclick=()=>{var them=!chon[tab].has(ix);them?chon[tab].add(ix):chon[tab].delete(ix);
   veGrid();if(tab!=='vm'){veMam();if(them)api({a:'le',n:1}).then(nhan);}};
  g.appendChild(d);});
 $('#hint').textContent=HINT[tab];
 $('#b-hoa').style.display=tab==='vm'?'':'none';
 $('#b-all').textContent=tab==='vm'?'Chọn tất cả':'Dâng cả mâm';}
function veMam(){const m=$('#mam');m.innerHTML='';let n=0;
 ['le','co'].forEach(t=>chon[t].forEach(ix=>{const o=LEVAT[t][ix];n++;
  const d=document.createElement('div');d.className='dish';
  d.innerHTML='<div class="ic"></div><div class="lb"></div>';
  d.querySelector('.ic').innerHTML=icon(o.s);d.querySelector('.lb').textContent=o.n;
  m.appendChild(d);requestAnimationFrame(()=>d.classList.add('on'));}));
 if(!ONLINE&&n>nL){nL=n;dem();}}
function openTab(t){tab=t;$$('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));
 veGrid();$('#sheet').classList.add('open');}
$$('.tabs button').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));
$('#bs').onclick=()=>openTab('le');
$('#bg2').onclick=()=>openTab('vm');
$('#b-all').onclick=()=>{var k=LEVAT[tab].length-chon[tab].size;LEVAT[tab].forEach((_,i)=>chon[tab].add(i));
 veGrid();if(tab!=='vm'){veMam();if(k>0)api({a:'le',n:Math.min(k,9)}).then(nhan);}chuong(470);};
$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('open'));

let hoaing=false;
function hoaVang(){
 if(hoaing)return;
 if(!chon.vm.size){openTab('vm');return;}
 hoaing=true;$('#sheet').classList.remove('open');
 const lo=$('#lo'),pp=$('#lopaper');lo.classList.add('on');
 const list=[...chon.vm].map(i=>LEVAT.vm[i]),em={el:$('#lo .pot'),k:'fire'};
 EM.push(em);chuong(300);let i=0;
 const next=()=>{if(i>=list.length){setTimeout(()=>{em.dead=1;pp.innerHTML='';lo.classList.remove('on');
   hoaing=false;chon.vm.clear();veGrid();},2600);return;}
  pp.innerHTML=icon(list[i].s);pp.style.transition='none';pp.style.opacity=1;pp.style.transform='translateX(-50%) scale(1)';
  requestAnimationFrame(()=>{pp.style.transition='all 1.6s ease-in';pp.style.opacity=0;
   pp.style.transform='translateX(-50%) scale(.3) translateY(14px)';});
  i++;setTimeout(next,1700);};
 setTimeout(next,500);}
$('#b-hoa').onclick=hoaVang;

$('#bgal').onclick=()=>$('#gal').classList.add('open');

function slide(d){const s=$('#strip');s.scrollBy({left:d*s.clientWidth,behavior:'smooth'});}
$('#g-prev').onclick=()=>slide(-1);$('#g-next').onclick=()=>slide(1);
addEventListener('keydown',e=>{if(!$('#gal').classList.contains('open'))return;

function doc(){try{return JSON.parse(localStorage.getItem('loi')||'[]')}catch(e){return[]}}
function luuMay(ten,loi){const a=doc();a.push({ten:ten,loi:loi,luc:new Date().toLocaleDateString('vi-VN')});
 try{localStorage.setItem('loi',JSON.stringify(a))}catch(e){}}
function ve(){const a=(ONLINE&&SRV?SRV.loi:doc())||[],b=$('#msgs');
